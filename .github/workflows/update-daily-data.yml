name: Update daily market data

on:
  workflow_dispatch:
  schedule:
    # 22:00 UTC = 06:00 Asia/Taipei.
    - cron: "0 22 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-daily-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate daily data
        run: npm run update:daily

      - name: Syntax check
        run: npm run check

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/_data/daily-briefing.js api/_data/performance-snapshot.js
          if git diff --cached --quiet; then
            echo "No generated data changes."
          else
            git commit -m "Update daily market data"
            git push
          fi

      - name: Build static dashboard
        run: node scripts/build-static-pages.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
